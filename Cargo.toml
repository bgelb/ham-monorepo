[workspace]
members = [
    "crates/audiolib",
    "crates/ft8-decoder",
    "crates/ham-units-example",
    "crates/rigctl",
    "projects/cargo-example",
    "projects/ft8op",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
